<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Approve Withdrawal - Secure Marketplace</title>
<style>
body { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); font-family: Arial, sans-serif; min-height: 100vh; margin: 0; padding: 20px; }
.container { max-width: 500px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
button { background: #6a11cb; color: #fff; padding: 12px; border: none; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; }
button:hover { background: #5a0fb8; }
input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
h3 { color: #333; text-align: center; margin-bottom: 30px; }
.info { background: #f8f9fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
.info p { margin: 5px 0; color: #555; }
</style>
</head>
<body>
<div class="container">
<h3>Approve Withdrawal</h3>
<div class="info">
<p><strong>User:</strong> {{ withdrawal.user.username }}</p>
<p><strong>Amount:</strong> {{ withdrawal.amount }}</p>
<p><strong>Address:</strong> {{ withdrawal.address }}</p>
</div>
<form method="post">
    {% csrf_token %}
    <label>TOTP Code:</label>
    <input type="text" name="totp_code" placeholder="Enter TOTP" required>
    <label>Proof-of-Work:</label>
    <input type="text" name="pow_token" placeholder="PoW Token" required>
    <input type="hidden" name="honeypot" value="">
    <button type="submit">Approve</button>
</form>
</div>
</body>
</html>
