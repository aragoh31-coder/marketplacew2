<div class="visual-captcha-container">
    <div class="captcha-instructions">
        <h4>🧩 Visual Verification</h4>
        <p>Drag the correct piece to complete the puzzle</p>
    </div>
    
    <div class="captcha-main-area">
        <div id="captcha-main-image" class="captcha-main-image">
            <img id="main-image" src="" alt="Main puzzle image" />
            <div id="drop-zone" class="drop-zone"></div>
        </div>
    </div>
    
    <div class="captcha-pieces">
        <div class="pieces-label">Choose the correct piece:</div>
        <div id="captcha-slices" class="captcha-slices">
            <!-- Slice images will be populated by JavaScript -->
        </div>
    </div>
    
    <div class="captcha-controls">
        <button type="button" id="refresh-captcha" class="btn btn-secondary btn-sm">
            🔄 New Puzzle
        </button>
        <div id="captcha-status" class="captcha-status"></div>
    </div>
</div>

<style>
.visual-captcha-container {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 20px;
    margin: 20px 0;
    text-align: center;
}

.captcha-instructions h4 {
    color: #4ecdc4;
    margin-bottom: 5px;
}

.captcha-instructions p {
    color: #ccc;
    font-size: 14px;
    margin-bottom: 15px;
}

.captcha-main-area {
    position: relative;
    display: inline-block;
    margin: 15px 0;
}

.captcha-main-image {
    position: relative;
    border: 2px solid #333;
    border-radius: 4px;
    display: inline-block;
}

.captcha-main-image img {
    display: block;
    max-width: 100%;
    height: auto;
}

.drop-zone {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.captcha-pieces {
    margin: 20px 0;
}

.pieces-label {
    color: #ccc;
    font-size: 14px;
    margin-bottom: 10px;
}

.captcha-slices {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.captcha-slice {
    border: 2px solid #333;
    border-radius: 4px;
    cursor: grab;
    transition: all 0.3s ease;
    position: relative;
}

.captcha-slice:hover {
    border-color: #4ecdc4;
    transform: scale(1.05);
}

.captcha-slice.dragging {
    opacity: 0.5;
    cursor: grabbing;
}

.captcha-slice.selected {
    border-color: #4ecdc4;
    box-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
}

.captcha-controls {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.captcha-status {
    font-size: 14px;
    padding: 5px 10px;
    border-radius: 4px;
}

.captcha-status.success {
    background: rgba(76, 175, 80, 0.2);
    color: #4caf50;
    border: 1px solid #4caf50;
}

.captcha-status.error {
    background: rgba(244, 67, 54, 0.2);
    color: #f44336;
    border: 1px solid #f44336;
}

.captcha-status.loading {
    background: rgba(255, 193, 7, 0.2);
    color: #ffc107;
    border: 1px solid #ffc107;
}

@media (max-width: 768px) {
    .captcha-main-image img {
        max-width: 280px;
    }
    
    .captcha-slices {
        gap: 8px;
    }
    
    .captcha-slice {
        width: 45px;
        height: 45px;
    }
    
    .captcha-controls {
        flex-direction: column;
        gap: 10px;
    }
}
</style>

<script>
class VisualCaptchaWidget {
    constructor() {
        this.currentSessionId = null;
        this.selectedSlice = null;
        this.isValidated = false;
        this.init();
    }
    
    init() {
        this.bindEvents();
        this.loadCaptcha();
    }
    
    bindEvents() {
        document.getElementById('refresh-captcha').addEventListener('click', () => {
            this.loadCaptcha();
        });
    }
    
    async loadCaptcha() {
        this.setStatus('Loading puzzle...', 'loading');
        
        try {
            const response = await fetch('/security/captcha/generate/', {
                method: 'GET',
                headers: {
                    'X-CSRFToken': this.getCSRFToken()
                }
            });
            
            const data = await response.json();
            
            if (data.success) {
                this.currentSessionId = data.session_id;
                this.displayCaptcha(data);
                this.setStatus('Drag the correct piece to the missing area', '');
            } else {
                this.setStatus('Failed to load puzzle: ' + data.error, 'error');
            }
        } catch (error) {
            this.setStatus('Network error loading puzzle', 'error');
        }
    }
    
    displayCaptcha(data) {
        // Display main image
        const mainImg = document.getElementById('main-image');
        mainImg.src = 'data:image/png;base64,' + data.main_image;
        
        // Display slice options
        const slicesContainer = document.getElementById('captcha-slices');
        slicesContainer.innerHTML = '';
        
        data.slice_images.forEach((sliceData, index) => {
            const sliceImg = document.createElement('img');
            sliceImg.src = 'data:image/png;base64,' + sliceData;
            sliceImg.className = 'captcha-slice';
            sliceImg.draggable = true;
            sliceImg.dataset.index = index;
            
            // Add drag events
            sliceImg.addEventListener('dragstart', (e) => {
                this.selectedSlice = index;
                e.target.classList.add('dragging');
            });
            
            sliceImg.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
            });
            
            sliceImg.addEventListener('click', () => {
                // Remove previous selection
                document.querySelectorAll('.captcha-slice').forEach(slice => {
                    slice.classList.remove('selected');
                });
                // Add selection to clicked slice
                sliceImg.classList.add('selected');
                this.selectedSlice = index;
            });
            
            slicesContainer.appendChild(sliceImg);
        });
        
        // Make main image a drop zone
        const mainImage = document.getElementById('captcha-main-image');
        mainImage.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        
        mainImage.addEventListener('drop', (e) => {
            e.preventDefault();
            if (this.selectedSlice !== null) {
                const rect = mainImage.getBoundingClientRect();
                const dropX = e.clientX - rect.left;
                const dropY = e.clientY - rect.top;
                this.validateCaptcha(dropX, dropY);
            }
        });
        
        // Also allow click validation for mobile
        mainImage.addEventListener('click', (e) => {
            if (this.selectedSlice !== null) {
                const rect = mainImage.getBoundingClientRect();
                const dropX = e.clientX - rect.left;
                const dropY = e.clientY - rect.top;
                this.validateCaptcha(dropX, dropY);
            } else {
                this.setStatus('Please select a piece first', 'error');
            }
        });
    }
    
    async validateCaptcha(dropX, dropY) {
        if (this.selectedSlice === null) {
            this.setStatus('Please select a piece first', 'error');
            return;
        }
        
        this.setStatus('Checking solution...', 'loading');
        
        try {
            const response = await fetch('/security/captcha/validate/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': this.getCSRFToken()
                },
                body: JSON.stringify({
                    session_id: this.currentSessionId,
                    selected_slice: this.selectedSlice,
                    drop_x: dropX,
                    drop_y: dropY
                })
            });
            
            const data = await response.json();
            
            if (data.success) {
                this.setStatus('✅ Puzzle solved correctly!', 'success');
                this.isValidated = true;
                
                // Disable further interaction
                document.querySelectorAll('.captcha-slice').forEach(slice => {
                    slice.style.pointerEvents = 'none';
                    slice.style.opacity = '0.5';
                });
                document.getElementById('captcha-main-image').style.pointerEvents = 'none';
                document.getElementById('refresh-captcha').style.display = 'none';
                
            } else {
                this.setStatus('❌ ' + data.message, 'error');
                // Allow retry
                setTimeout(() => {
                    this.setStatus('Try again or refresh for a new puzzle', '');
                }, 2000);
            }
        } catch (error) {
            this.setStatus('Network error during validation', 'error');
        }
    }
    
    setStatus(message, type) {
        const statusDiv = document.getElementById('captcha-status');
        statusDiv.textContent = message;
        statusDiv.className = 'captcha-status ' + type;
    }
    
    getCSRFToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }
}

// Initialize when DOM is loaded
document.addEventListener('DOMContentLoaded', () => {
    if (document.querySelector('.visual-captcha-container')) {
        new VisualCaptchaWidget();
    }
});
</script>
</div>
