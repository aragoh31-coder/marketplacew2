<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Secure Marketplace</title>
<style>
body { background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); font-family: Arial, sans-serif; min-height: 100vh; margin: 0; padding: 20px; }
.container { max-width: 400px; margin: 80px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
button { background: #6a11cb; color: #fff; padding: 12px; border: none; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; margin: 5px; }
button:hover { background: #5a0fb8; }
input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
h2 { color: #333; text-align: center; margin-bottom: 30px; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
.links { text-align: center; margin-top: 20px; }
.links a { color: #6a11cb; text-decoration: none; }
.links a:hover { text-decoration: underline; }
.captcha-section { margin: 20px 0; text-align: center; }
.captcha-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.captcha-buttons button { width: auto; min-width: 120px; }
</style>
</head>
<body>
<div class="container">
<h2>Login</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="honeypot" value="">
    <div class="captcha-section">
        <p>Click the missing slice:</p>
        <div class="captcha-image-container">
            <img src="data:image/png;base64,{{ captcha_image }}" alt="CAPTCHA" style="display: block; margin: 0 auto; border-radius: 8px;">
        </div>
        <input type="hidden" name="captcha_token" value="{{ captcha_token }}">
        <input type="hidden" name="captcha_timestamp" value="{{ captcha_timestamp }}">
        <input type="hidden" name="pow_challenge" value="{{ pow_challenge }}">
        <div class="captcha-buttons">
            {% for i in "012345678901" %}
            <button type="submit" name="segment" value="{{forloop.counter0}}" class="captcha-btn">Slice {{forloop.counter}}</button>
            {% endfor %}
        </div>
        <style>
            .captcha-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px auto; max-width: 300px; }
            .captcha-btn { background: #6a11cb; color: #fff; padding: 12px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
            .captcha-btn:hover { background: #5a0fb8; }
        </style>
    </div>
</form>
<div class="links">
    <a href="{% url 'accounts:register' %}">Create Account</a>
</div>
</div>
</body>
</html>
