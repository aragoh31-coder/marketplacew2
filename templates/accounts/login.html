{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <div class="auth-header">
            <h1>Login</h1>
        </div>


        <form method="post" action="{% url 'accounts:login' %}" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Username</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Password</label>
                {{ form.password }}
            </div>

            <div class="form-group">
                <label>{{ captcha_question }}</label><br>
                <img src="{{ captcha_image|safe }}" alt="CAPTCHA challenge"><br>
                <input type="text" name="captcha" required class="form-control" placeholder="Your answer">
            </div>

            <button type="submit" class="btn btn-primary btn-login">
                Login
            </button>
        </form>

        <div class="auth-links">
            <p>Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></p>
            <p><a href="{% url 'accounts:pgp_login' %}">Login with PGP Key</a></p>
        </div>
    </div>
</div>
{% endblock %}
