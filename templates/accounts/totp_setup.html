<h3>TOTP Setup</h3>
<p>Enter this key in your authenticator app:</p>
<code>{{ manual_entry_key }}</code>
<p>Enter the 6-digit code:</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="honeypot" value="">
    <input type="text" name="pow_token" placeholder="Proof-of-Work Token">
    <button type="submit">Verify</button>
</form>
