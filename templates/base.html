{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <!-- Local TailwindCSS -->
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="bg-gray-100 text-gray-900">
    <style>
        /* CSS-only mobile navigation */
        .mobile-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        #mobile-nav-toggle:checked + .mobile-menu {
            max-height: 500px;
            display: block !important;
        }
        
        /* Ensure mobile menu is properly positioned */
        .navbar-container {
            position: relative;
        }
        
        /* Fix mobile navigation visibility */
        @media (max-width: 768px) {
            .mobile-menu {
                position: relative;
                width: 100%;
                z-index: 50;
            }
            
            /* Force hamburger menu visibility on mobile - override TailwindCSS */
            label[for="mobile-nav-toggle"] {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                width: 48px !important;
                height: 48px !important;
                min-width: 48px !important;
                min-height: 48px !important;
                position: fixed !important;
                top: 10px !important;
                right: 10px !important;
                z-index: 9999 !important;
                background-color: rgba(55, 65, 81, 0.9) !important;
                border-radius: 4px !important;
                padding: 12px !important;
                cursor: pointer !important;
            }
            
            /* Force SVG icon visibility */
            label[for="mobile-nav-toggle"] svg {
                display: block !important;
                width: 24px !important;
                height: 24px !important;
                stroke: white !important;
                stroke-width: 2 !important;
                fill: none !important;
            }
            
            /* Mobile menu visibility when checkbox is checked */
            #mobile-nav-toggle:checked ~ .mobile-menu {
                max-height: 500px !important;
                display: block !important;
                position: fixed !important;
                top: 70px !important;
                left: 0 !important;
                right: 0 !important;
                z-index: 9998 !important;
                background-color: rgba(31, 41, 55, 0.95) !important;
                backdrop-filter: blur(10px) !important;
            }
            
            /* Hide mobile menu by default */
            .mobile-menu {
                max-height: 0 !important;
                overflow: hidden !important;
                transition: max-height 0.3s ease-out !important;
            }
            
            /* Hide on desktop only */
            @media (min-width: 768px) {
                label[for="mobile-nav-toggle"] {
                    display: none !important;
                }
                .mobile-menu {
                    display: none !important;
                }
            }
        }
    </style>

    <!-- NAVBAR -->
    <nav class="bg-gray-900 text-white shadow-md">
        <div class="navbar-container max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-xl font-bold">Marketplace</a>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="{% url 'products:list' %}" class="hover:text-gray-300">Products</a>
                    <a href="{% url 'orders:list' %}" class="hover:text-gray-300">Orders</a>
                    <a href="{% url 'wallets:dashboard' %}" class="hover:text-gray-300">Wallet</a>

                    <!-- Dropdown (CSS-only with group hover) -->
                    <div class="relative group">
                        <button class="inline-flex items-center">
                            Account
                            <svg class="ml-1 h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                        <!-- Dropdown Menu -->
                        <div class="absolute right-0 mt-2 w-48 bg-gray-800 rounded-md shadow-lg opacity-0 group-hover:opacity-100 invisible group-hover:visible transition-opacity duration-200">
                            <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 hover:bg-gray-700">Profile</a>
                            <a href="{% url 'accounts:profile_settings' %}" class="block px-4 py-2 hover:bg-gray-700">Settings</a>
                            <a href="{% url 'messaging:list' %}" class="block px-4 py-2 hover:bg-gray-700">Messages</a>
                            <a href="{% url 'support:home' %}" class="block px-4 py-2 hover:bg-gray-700">Support</a>
                            <a href="{% url 'logout' %}" class="block px-4 py-2 hover:bg-gray-700 text-red-400">Logout</a>
                        </div>
                    </div>
                </div>

                <!-- Mobile Toggle (CSS-only) -->
                <div class="flex md:hidden items-center">
                    <label for="mobile-nav-toggle" class="cursor-pointer p-2 text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </label>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Navigation (CSS-only) -->
    <input type="checkbox" id="mobile-nav-toggle" class="hidden">
    <div class="mobile-menu bg-gray-800 md:hidden w-full">
        <a href="/" class="block px-4 py-2 hover:bg-gray-700 text-white">Home</a>
        <a href="{% url 'products:list' %}" class="block px-4 py-2 hover:bg-gray-700 text-white">Products</a>
        <a href="{% url 'orders:list' %}" class="block px-4 py-2 hover:bg-gray-700 text-white">Orders</a>
        <a href="{% url 'wallets:dashboard' %}" class="block px-4 py-2 hover:bg-gray-700 text-white">Wallet</a>
        <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 hover:bg-gray-700 text-white">Profile</a>
        <a href="{% url 'accounts:profile_settings' %}" class="block px-4 py-2 hover:bg-gray-700 text-white">Settings</a>
        <a href="{% url 'messaging:list' %}" class="block px-4 py-2 hover:bg-gray-700 text-white">Messages</a>
        <a href="{% url 'support:home' %}" class="block px-4 py-2 hover:bg-gray-700 text-white">Support</a>
        <a href="{% url 'logout' %}" class="block px-4 py-2 hover:bg-gray-700 text-red-400">Logout</a>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 text-center text-sm">
        © Secure Marketplace
    </footer>
</body>
</html>
