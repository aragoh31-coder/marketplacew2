{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>

  <!-- 3.1—Self-hosted Tailwind -->
  <link href="{% static 'css/tailwind.css' %}" rel="stylesheet"/>

  <!-- 3.2—Font-Awesome (optional) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"/>

  <!-- 3.3—CSS-only interactivity hacks -->
  <style>
    /* hide toggles */
    #sidebar-toggle, #user-menu-toggle, #categories-toggle { display: none; }

    /* sidebar slide */
    .sidebar { transform: translateX(-100%); transition: transform .3s ease; }
    #sidebar-toggle:checked ~ .sidebar { transform: translateX(0); }

    /* overlay fade */
    .overlay { pointer-events: none; opacity: 0; transition: opacity .3s ease; }
    #sidebar-toggle:checked ~ .overlay { pointer-events: auto; opacity: .5; }

    /* dropdown show/hide */
    .dropdown { display: none; }
    .group:hover .dropdown,
    input.dropdown-toggle:checked + label + .dropdown { display: block; }
  </style>
</head>

<body class="flex h-full bg-gray-50">

  <!-- 3.4—Sidebar toggle -->
  <input type="checkbox" id="sidebar-toggle"/>

  <!-- overlay -->
  <label for="sidebar-toggle" class="overlay fixed inset-0 bg-black"></label>

  <!-- sidebar -->
  <aside class="sidebar fixed inset-y-0 left-0 w-64 bg-gray-800 text-white p-6 z-20">
    <label for="sidebar-toggle"
           class="flex items-center mb-6 cursor-pointer hover:text-gray-300">
      <i class="fas fa-times"></i><span class="ml-2">Close Menu</span>
    </label>
    <nav class="space-y-4">
      <a href="{% url 'accounts:home' %}" class="block py-2 px-4 rounded hover:bg-gray-700">Home</a>
      <a href="{% url 'products:list' %}" class="block py-2 px-4 rounded hover:bg-gray-700">Products</a>
      <a href="{% url 'orders:list' %}" class="block py-2 px-4 rounded hover:bg-gray-700">My Orders</a>
      <a href="{% url 'accounts:home' %}" class="block py-2 px-4 rounded hover:bg-gray-700">Account</a>
    </nav>
  </aside>

  <!-- main panel -->
  <div class="flex-1 flex flex-col">

    <!-- top toolbar -->
    <header class="flex items-center justify-between bg-white shadow px-6 py-4 z-10">
      <div class="flex items-center space-x-4">
        <label for="sidebar-toggle"
               class="p-2 rounded text-gray-600 hover:bg-gray-100 hover:text-gray-800 cursor-pointer">
          <i class="fas fa-bars text-2xl"></i>
        </label>
        <a href="{% url 'accounts:home' %}" class="text-2xl font-semibold text-gray-800">SecureMarket</a>
      </div>

      <!-- desktop nav -->
      <nav class="hidden md:flex items-center space-x-8">
        <div class="relative group">
          <input type="checkbox" id="categories-toggle" class="dropdown-toggle hidden"/>
          <label for="categories-toggle"
                 class="text-gray-700 hover:text-gray-900 cursor-pointer">
            Categories <i class="fas fa-caret-down ml-1"></i>
          </label>
          <ul class="dropdown absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg">
            <li><a href="{% url 'products:list' %}"
                   class="block px-4 py-2 hover:bg-gray-100">Electronics</a></li>
            <li><a href="{% url 'products:list' %}"
                   class="block px-4 py-2 hover:bg-gray-100">Digital Goods</a></li>
            <li><a href="{% url 'products:list' %}"
                   class="block px-4 py-2 hover:bg-gray-100">Services</a></li>
          </ul>
        </div>
        <div class="relative">
          <input type="checkbox" id="user-menu-toggle" class="dropdown-toggle hidden"/>
          <label for="user-menu-toggle"
                 class="text-gray-700 hover:text-gray-900 cursor-pointer">
            Account <i class="fas fa-caret-down ml-1"></i>
          </label>
          <ul class="dropdown absolute right-0 mt-2 w-40 bg-white rounded-lg shadow-lg">
            <li><a href="{% url 'accounts:home' %}"
                   class="block px-4 py-2 hover:bg-gray-100">Profile</a></li>
            <li><a href="{% url 'accounts:home' %}"
                   class="block px-4 py-2 hover:bg-gray-100">Settings</a></li>
            <li><a href="{% url 'logout' %}"
                   class="block px-4 py-2 hover:bg-gray-100">Log Out</a></li>
          </ul>
        </div>
      </nav>

      <!-- mobile icons -->
      <div class="md:hidden flex items-center space-x-4">
        <a href="{% url 'orders:cart' %}"
           class="text-gray-600 hover:text-gray-800">
          <i class="fas fa-shopping-cart text-2xl"></i>
        </a>
        <label for="user-menu-toggle"
               class="text-gray-600 hover:text-gray-800 cursor-pointer">
          <i class="fas fa-user-circle text-2xl"></i>
        </label>
      </div>
    </header>

    <!-- page content -->
    <main class="flex-1 overflow-auto p-6 bg-gray-50">
      {% block content %}{% endblock %}
    </main>
  </div>

</body>
</html>
