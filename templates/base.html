{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <!-- Local TailwindCSS -->
    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
</head>
<body class="bg-gray-100 text-gray-900">

    <!-- NAVBAR -->
    <nav class="bg-gray-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="/" class="text-xl font-bold">Marketplace</a>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-6">
                    <a href="{% url 'products:list' %}" class="hover:text-gray-300">Products</a>
                    <a href="{% url 'orders:list' %}" class="hover:text-gray-300">Orders</a>
                    <a href="{% url 'wallets:dashboard' %}" class="hover:text-gray-300">Wallet</a>

                    <!-- Dropdown without JS -->
                    <div class="relative group">
                        <button class="inline-flex items-center">
                            Account
                            <svg class="ml-1 h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                        <!-- Dropdown Menu -->
                        <div class="absolute right-0 mt-2 w-48 bg-gray-800 rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 invisible group-hover:visible">
                            <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 hover:bg-gray-700">Profile</a>
                            <a href="{% url 'accounts:profile_settings' %}" class="block px-4 py-2 hover:bg-gray-700">Settings</a>
                            <a href="{% url 'messaging:list' %}" class="block px-4 py-2 hover:bg-gray-700">Messages</a>
                            <a href="{% url 'support:home' %}" class="block px-4 py-2 hover:bg-gray-700">Support</a>
                            <a href="{% url 'logout' %}" class="block px-4 py-2 hover:bg-gray-700 text-red-400">Logout</a>
                        </div>
                    </div>
                </div>

                <!-- Mobile Toggle -->
                <div class="flex md:hidden items-center">
                    <input type="checkbox" id="menu-toggle" class="peer hidden">
                    <label for="menu-toggle" class="cursor-pointer">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </label>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div class="hidden peer-checked:block bg-gray-800 md:hidden">
            <a href="{% url 'products:list' %}" class="block px-4 py-2 hover:bg-gray-700">Products</a>
            <a href="{% url 'orders:list' %}" class="block px-4 py-2 hover:bg-gray-700">Orders</a>
            <a href="{% url 'wallets:dashboard' %}" class="block px-4 py-2 hover:bg-gray-700">Wallet</a>
            <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 hover:bg-gray-700">Profile</a>
            <a href="{% url 'accounts:profile_settings' %}" class="block px-4 py-2 hover:bg-gray-700">Settings</a>
            <a href="{% url 'messaging:list' %}" class="block px-4 py-2 hover:bg-gray-700">Messages</a>
            <a href="{% url 'support:home' %}" class="block px-4 py-2 hover:bg-gray-700">Support</a>
            <a href="{% url 'logout' %}" class="block px-4 py-2 hover:bg-gray-700 text-red-400">Logout</a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto p-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white p-4 text-center text-sm">
        © Secure Marketplace
    </footer>
</body>
</html>
