version: '3'

services:
  openresty:
    image: openresty/openresty:alpine
    container_name: openresty_antiddos
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./openresty/lua:/etc/openresty/lua
    depends_on:
      - django
      - redis
    networks:
      - tor-net
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_HOST=django
      - DJANGO_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  django:
    build: .
    container_name: django_app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
      - ALLOWED_HOSTS=*.onion,localhost,127.0.0.1,django,openresty,bitcoind,monerod,monero-wallet-rpc,172.18.0.0/16
    volumes:
      - .:/app
      - ./secure_uploads:/app/secure_uploads
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tor-net

  celery:
    build: .
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A marketplace worker -l info
    networks:
      - tor-net

  celery-beat:
    build: .
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A marketplace beat -l info
    networks:
      - tor-net

  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor-hybrid
    container_name: tor_hybrid_service
    restart: always
    ports:
      - "9051:9050"
    volumes:
      - tor_hidden_service:/var/lib/tor/hidden_service
      - ./torrc:/etc/tor/torrc
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9050 > /dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 3
    networks:
      - tor-net

  bitcoind:
    image: ruimarinho/bitcoin-core:latest
    container_name: bitcoind_rpc
    ports:
      - "8332:8332"
      - "8333:8333"
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    environment:
      - BITCOIN_DATA=/home/bitcoin/.bitcoin
    command: >
      bitcoind
      -server=1
      -rpcallowip=0.0.0.0/0
      -rpcbind=0.0.0.0:8332
      -rpcuser=bitcoin_user
      -rpcpassword=bitcoin_password
      -txindex=1
      -testnet=0
      -printtoconsole=1
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-rpcuser=bitcoin_user", "-rpcpassword=bitcoin_password", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  monerod:
    image: kannix/monero-full-node:latest
    container_name: monero_daemon
    ports:
      - "18081:18081"
    volumes:
      - monero_data:/root/.bitmonero
    environment:
      - DAEMON_HOST=0.0.0.0
      - DAEMON_PORT=18081
    command: >
      --rpc-bind-ip=0.0.0.0
      --rpc-bind-port=18081
      --confirm-external-bind
      --log-level=1
      --non-interactive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18081/get_info"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  # Note: monero-wallet-rpc temporarily disabled as kannix/monero-full-node:latest 
  # only includes monerod daemon, not wallet RPC binary
  # monero-wallet-rpc:
  #   image: kannix/monero-full-node:latest
  #   container_name: monero_wallet_rpc
  #   ports:
  #     - "18088:18088"
  #   volumes:
  #     - monero_wallet_data:/home/monero/wallet
  #   depends_on:
  #     - monerod
  #   environment:
  #     - DAEMON_HOST=monerod
  #     - DAEMON_PORT=18081
  #   command: >
  #     /home/monero/monero-wallet-rpc
  #     --daemon-address=monerod:18081
  #     --wallet-dir=/home/monero/wallet
  #     --rpc-bind-ip=0.0.0.0
  #     --rpc-bind-port=18088
  #     --confirm-external-bind
  #     --log-level=1
  #     --disable-rpc-login
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:18088/json_rpc"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - tor-net

networks:
  tor-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  bitcoin_data:
  monero_data:
  monero_wallet_data:
  tor_hidden_service:
