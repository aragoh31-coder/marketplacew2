version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - BITCOIND_RPC_URL=${BITCOIND_RPC_URL}
      - BITCOIND_RPC_USER=${BITCOIND_RPC_USER}
      - BITCOIND_RPC_PASSWORD=${BITCOIND_RPC_PASSWORD}
      - MONERO_WALLET_RPC_PORT=${MONERO_WALLET_RPC_PORT}
      - MONERO_DAEMON_RPC_PORT=${MONERO_DAEMON_RPC_PORT}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MASTER_PASSWORD=${MASTER_PASSWORD}
      - MASTER_SALT=${MASTER_SALT}
      - ADMIN_SECONDARY_PASSWORD=${ADMIN_SECONDARY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./secure_uploads:/app/secure_uploads
      - ./temp_uploads:/app/temp_uploads
    command: >
      sh -c "python manage.py migrate --run-syncdb &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 marketplace.wsgi:application"

  celery:
    build: .
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - BITCOIND_RPC_URL=${BITCOIND_RPC_URL}
      - BITCOIND_RPC_USER=${BITCOIND_RPC_USER}
      - BITCOIND_RPC_PASSWORD=${BITCOIND_RPC_PASSWORD}
      - MONERO_WALLET_RPC_PORT=${MONERO_WALLET_RPC_PORT}
      - MONERO_DAEMON_RPC_PORT=${MONERO_DAEMON_RPC_PORT}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MASTER_PASSWORD=${MASTER_PASSWORD}
      - MASTER_SALT=${MASTER_SALT}
      - ADMIN_SECONDARY_PASSWORD=${ADMIN_SECONDARY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./secure_uploads:/app/secure_uploads
      - ./temp_uploads:/app/temp_uploads
    command: celery -A marketplace worker -l info

  celery-beat:
    build: .
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - BITCOIND_RPC_URL=${BITCOIND_RPC_URL}
      - BITCOIND_RPC_USER=${BITCOIND_RPC_USER}
      - BITCOIND_RPC_PASSWORD=${BITCOIND_RPC_PASSWORD}
      - MONERO_WALLET_RPC_PORT=${MONERO_WALLET_RPC_PORT}
      - MONERO_DAEMON_RPC_PORT=${MONERO_DAEMON_RPC_PORT}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - MASTER_PASSWORD=${MASTER_PASSWORD}
      - MASTER_SALT=${MASTER_SALT}
      - ADMIN_SECONDARY_PASSWORD=${ADMIN_SECONDARY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: celery -A marketplace beat -l info

volumes:
  postgres_data:
  redis_data:
