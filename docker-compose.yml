version: '3'

services:
  openresty:
    image: openresty/openresty:alpine
    container_name: openresty_antiddos
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./openresty/lua:/etc/openresty/lua
    depends_on:
      - django
      - redis
    networks:
      - tor-net
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_HOST=django
      - DJANGO_PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  django:
    build: .
    container_name: django_app
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
      - ALLOWED_HOSTS=*.onion,localhost,127.0.0.1,django,172.18.0.6,openresty
    volumes:
      - .:/app
      - ./secure_uploads:/app/secure_uploads
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tor-net

  celery:
    build: .
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A marketplace worker -l info
    networks:
      - tor-net

  celery-beat:
    build: .
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A marketplace beat -l info
    networks:
      - tor-net

  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor-hybrid
    container_name: tor_hybrid_service
    restart: always
    ports:
      - "9051:9050"
    volumes:
      - /opt/tor/hidden_service:/var/lib/tor/hidden_service
      - ./torrc:/etc/tor/torrc
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9050 > /dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 3
    networks:
      - tor-net

networks:
  tor-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
