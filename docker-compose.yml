version: '3.8'

services:
  django:
    build: .
    container_name: django_app
    command: gunicorn marketplace.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    restart: always
    environment:
      - DJANGO_SECRET_KEY=production-secret-key-change-in-production-deployment
      - ALLOWED_HOSTS=.onion,localhost,127.0.0.1
      - BITCOIND_RPC_USER=bitcoinuser
      - BITCOIND_RPC_PASSWORD=bitcoinpass
      - BITCOIND_RPC_HOST=127.0.0.1
      - BITCOIND_RPC_PORT=8332
      - MONERO_RPC_HOST=127.0.0.1
      - MONERO_RPC_PORT=18081
      - MONERO_RPC_USER=monerouser
      - MONERO_RPC_PASSWORD=moneropass
    expose:
      - "8000"
    networks:
      - tor-net
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: marketplace_db
    restart: always
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: secureuser
      POSTGRES_PASSWORD: securepassword
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - tor-net

  tor:
    image: osminogin/tor-simple:latest
    container_name: tor_service
    restart: always
    volumes:
      - /opt/tor/hidden_service:/var/lib/tor/hidden_service
      - /opt/tor/torrc:/etc/tor/torrc
    networks:
      - tor-net
    depends_on:
      - django

networks:
  tor-net:
    driver: bridge

volumes:
  db_data:
