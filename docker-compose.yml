version: '3'

services:
  openresty:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./openresty/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf
      - ./openresty/lua:/etc/openresty/lua
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - django
      - redis
    networks:
      tor-net:
        ipv4_address: 172.28.0.10
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DJANGO_HOST=django
      - DJANGO_PORT=8000
      - HMAC_KEY=${HMAC_KEY}
      - ONION_HOST=${ONION_HOST}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Host: ${ONION_HOST}' --spider http://127.0.0.1/static/css/main.css && wget -q --header='Host: ${ONION_HOST}' --spider http://127.0.0.1/static/css/tailwind.min.css"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - tor-net

  django:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
      - ALLOWED_HOSTS=*.onion,localhost,127.0.0.1,django,openresty
      - ONION_HOST=${ONION_HOST}
    volumes:
      - .:/app
      - ./secure_uploads:/app/secure_uploads
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tor-net

  celery:
    build: .
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A marketplace worker -l info
    networks:
      - tor-net

  celery-beat:
    build: .
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=postgresql://marketplace:marketplace_password@db:5432/marketplace
    volumes:
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A marketplace beat -l info
    networks:
      - tor-net

  tor:
    build:
      context: .
      dockerfile: Dockerfile.tor-hybrid
    restart: always
    environment:
      - OPENRESTY_IP=172.28.0.10
    volumes:
      - /opt/tor/hidden_service:/var/lib/tor/hidden_service
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 20s
      retries: 3
    networks:
      - tor-net

networks:
  tor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
