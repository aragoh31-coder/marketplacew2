worker_processes auto;
env HMAC_KEY;

events { 
    worker_connections 1024; 
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    resolver 127.0.0.11 valid=30s;
    
    lua_shared_dict rl_cache 50m;
    lua_shared_dict pow_cache 20m;
    lua_shared_dict session_cache 50m;
    lua_shared_dict blocked_ips 10m;
    
    lua_package_path '/etc/openresty/lua/?.lua;;';
    
    # init_worker_by_lua_block {
    #     require("pow_solver"):start_background_solver()
    # }
    
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /dev/stdout main;
    error_log /dev/stderr warn;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json font/woff2 application/font-woff;
    
    server {
        listen 80;
        server_name _;
        location = / {
            return 302 /anti_ddos/challenge/;
        }
        
        client_max_body_size 10M;
        # Enforce onion-only access
        if ($host !~* \.onion$) { return 444; }

        # Security headers at edge
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        client_body_timeout 60s;
        client_header_timeout 60s;

        set $django_upstream django:8000;
        
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        location /pow-challenge {
            content_by_lua_file /etc/openresty/lua/pow_challenge.lua;
        }
        
        location /pow-verify {
            content_by_lua_file /etc/openresty/lua/pow_verify.lua;
        }
        
        location /openresty-status {
            access_by_lua_block {
                if ngx.var.remote_addr ~= "127.0.0.1" then
                    ngx.exit(403)
                end
            }
            content_by_lua_file /etc/openresty/lua/status.lua;
        }
        
        
        # Serve collected static files directly from the container
        location ^~ /static/ {
            alias /app/staticfiles/;
            access_log off;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }


        location / {
            # Run Lua gatekeeper for all non-root paths
            access_by_lua_file /etc/openresty/lua/antiddos_gatekeeper.lua;

            add_header X-Content-Type-Options "nosniff" always;

            proxy_pass http://$django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host openresty;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-PoW-Verified $http_x_pow_verified;
            proxy_set_header X-OpenResty-Filtered "true";
            proxy_set_header X-Client-Fingerprint $http_x_client_fingerprint;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }
}
