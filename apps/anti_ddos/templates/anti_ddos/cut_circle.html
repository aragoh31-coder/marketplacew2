<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Verification</title>
  <style>
    /* Tailwind CSS v3.2.4 (minified subset) */
    *{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
    *::before,*::after{box-sizing:border-box}
    html{line-height:1.5;-webkit-text-size-adjust:100%;-moz-tab-size:4;tab-size:4;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji"}
    body{margin:0;line-height:inherit}
    .bg-gray-900{background-color:#111827}
    .text-white{color:#fff}
    .text-2xl{font-size:1.5rem;line-height:2rem}
    .flex{display:flex}
    .flex-col{flex-direction:column}
    .items-center{align-items:center}
    .justify-center{justify-content:center}
    .h-screen{height:100vh}
    .mb-4{margin-bottom:1rem}
    .mt-4{margin-top:1rem}
    .p-3{padding:0.75rem}
    .rounded{border-radius:0.25rem}
    .bg-blue-600{background-color:#2563eb}
    .hover\:bg-blue-700:hover{background-color:#1d4ed8}
    .transition{transition-property:color,background-color,border-color,text-decoration-color,fill,stroke,opacity,box-shadow,transform,filter,backdrop-filter;transition-timing-function:cubic-bezier(0.4,0,0.2,1);transition-duration:150ms}
    .duration-200{transition-duration:200ms}
    .circle{width:10rem;height:10rem;border:4px solid #3b82f6;border-radius:50%;position:relative;margin:2rem auto}
    .cut{width:50%;height:100%;background:#111827;position:absolute;top:0;right:0;border-radius:0 50% 50% 0}
    .cursor-pointer{cursor:pointer}
  </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen">
  <h1 class="text-2xl mb-4">Rotate the circle to continue</h1>
  <p class="mb-4 text-gray-300">Click the circle to verify you're human</p>
  
  <div class="circle cursor-pointer" onclick="this.style.transform='rotate(180deg)'; this.style.transition='transform 0.5s';">
    <div class="cut"></div>
  </div>
  
  <form method="post" action="{% url 'anti_ddos:verify' %}" class="mt-4">
    {% csrf_token %}
    <input type="hidden" name="captcha_solution" value="rotated">
    <button type="submit" 
            class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded transition duration-200">
      Verify
    </button>
  </form>
  
  <p class="mt-4 text-sm text-gray-400">
    This helps us distinguish humans from automated bots
  </p>
</body>
</html>
