<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Verification</title>
  <style>
    body {
      background: #0d0d1d;
      color: white;
      font-family: monospace;
      text-align: center;
      padding-top: 10vh;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      background-color: #1a1a2e;
      border: 1px solid #333;
      border-radius: 8px;
    }
    .captcha-image {
      margin: 20px auto;
      max-width: 100%;
      border: 1px solid #444;
    }
    input {
      padding: 5px 10px;
      background-color: #222;
      color: white;
      border: 1px solid #555;
      margin-top: 10px;
      width: 100%;
    }
    button, input[type="submit"] {
      padding: 6px 15px;
      background-color: #444;
      color: white;
      border: none;
      margin-top: 10px;
      cursor: pointer;
      width: 100%;
    }
    .hidden {
      position: absolute;
      left: -9999px;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }
    .circle {
      width: 160px;
      height: 160px;
      border: 4px solid #3b82f6;
      border-radius: 50%;
      position: relative;
      margin: 2rem auto;
      cursor: pointer;
    }
    .cut {
      width: 50%;
      height: 100%;
      background: #1a1a2e;
      position: absolute;
      top: 0;
      right: 0;
      border-radius: 0 50% 50% 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Visual Verification</h2>
    <p>Rotate the circle to continue</p>
    
    <input type="checkbox" id="circle-toggle" class="hidden">
    <label for="circle-toggle" class="circle">
      <div class="cut"></div>
    </label>
    
    <form method="post" action="{% url 'anti_ddos:verify' %}">
      {% csrf_token %}
      <input type="hidden" name="captcha_solution" value="rotated">
      <button type="submit">Verify</button>
    </form>
    
    <div class="footer">
      <p>This helps us distinguish humans from automated bots</p>
      <p>No personal information is collected</p>
    </div>
  </div>
</body>
</html>
