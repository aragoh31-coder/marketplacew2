{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rate Limited - Security Protection</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    body { 
      background: linear-gradient(135deg, #0a0f1b 0%, #1a1a2e 100%);
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
    }
    .rate-limit-container {
      background: rgba(26, 26, 46, 0.9);
      border: 1px solid #ff6b6b;
      backdrop-filter: blur(10px);
    }
    .warning-icon {
      color: #ff6b6b;
      font-size: 3rem;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="rate-limit-container p-8 rounded-lg shadow-2xl max-w-md w-full text-center">
    <div class="warning-icon mb-4">⚠️</div>
    <h2 class="text-2xl font-bold mb-4 text-red-400">Rate Limit Exceeded</h2>
    <p class="text-gray-300 mb-6">
      You have made too many requests. Please wait before trying again.
    </p>
    
    <div class="bg-gray-800 p-4 rounded-lg mb-6">
      <p class="text-sm text-gray-400">Remaining requests: <span class="text-white font-bold">{{ remaining_requests }}</span></p>
      <p class="text-sm text-gray-400">Retry after: <span class="text-white font-bold">{{ retry_after }} seconds</span></p>
    </div>
    
    <div class="text-xs text-gray-500">
      <p>This protection helps maintain service availability for all users.</p>
    </div>
  </div>
</body>
</html>
