{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Please Wait</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <style>
    body { 
      background: linear-gradient(135deg, #1a1a0a 0%, #2e2e1a 100%);
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="bg-yellow-900 bg-opacity-50 p-8 rounded-lg shadow-2xl max-w-md w-full text-center">
    <h2 class="text-2xl font-bold mb-4 text-yellow-400">⏳ Please Wait</h2>
    <p class="text-gray-300 mb-6">You're submitting too quickly. Please wait a moment and try again.</p>
    <a href="javascript:history.back()" class="inline-block bg-yellow-600 hover:bg-yellow-700 px-6 py-3 rounded-lg text-white font-semibold transition-colors">
      Go Back
    </a>
  </div>
</body>
</html>
