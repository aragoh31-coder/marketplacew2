{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Verification</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <style>
    body { 
      background: linear-gradient(135deg, #0a0f1b 0%, #1a1a2e 100%);
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
    }
    .challenge-container {
      background: rgba(26, 26, 46, 0.9);
      border: 1px solid #333;
      backdrop-filter: blur(10px);
    }
    .btn-verify {
      background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
      transition: all 0.3s ease;
    }
    .btn-verify:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
  <div class="challenge-container p-8 rounded-lg shadow-2xl max-w-md w-full">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold mb-2">🛡️ Security Verification</h2>
      <p class="text-gray-400">Please complete this verification to continue</p>
    </div>
    
    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <input type="hidden" name="next" value="{{ request.GET.next|default:'/' }}">
      
      <!-- Honeypot field for bot detection -->
      <div style="position: absolute; left: -9999px;">
        <input type="text" name="hp_field" value="" tabindex="-1">
      </div>
      
      <!-- Math Challenge -->
      <div class="mb-6">
        <label class="block text-sm font-medium mb-2">Solve this math problem:</label>
        <div class="text-center mb-4">
          <span class="text-2xl font-bold text-blue-400">{{ math_question }}</span>
        </div>
        <input type="number" 
               name="math_answer" 
               class="w-full px-4 py-3 bg-gray-800 border border-gray-600 rounded-lg text-white focus:border-blue-500 focus:outline-none" 
               placeholder="Enter your answer"
               required
               autocomplete="off">
      </div>
      
      <div class="text-center">
        <button type="submit" class="btn-verify w-full py-3 px-6 rounded-lg font-semibold text-white">
          ✓ Submit Answer
        </button>
      </div>
      
      <div class="text-xs text-gray-500 text-center mt-4">
        <p>This verification helps protect against automated attacks</p>
        <p>No personal information is collected</p>
      </div>
    </form>
  </div>
</body>
</html>
