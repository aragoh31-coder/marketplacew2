<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Verification</title>
  <style>
    body {
      background: #0d0d1d;
      color: white;
      font-family: monospace;
      text-align: center;
      padding-top: 10vh;
    }
    input {
      padding: 5px 10px;
      background-color: #222;
      color: white;
      border: 1px solid #555;
      margin-top: 10px;
      width: 100%;
    }
    button, input[type="submit"] {
      padding: 6px 15px;
      background-color: #444;
      color: white;
      border: none;
      margin-top: 10px;
      cursor: pointer;
      width: 100%;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      background-color: #1a1a2e;
      border: 1px solid #333;
      border-radius: 8px;
    }
    .math-question {
      font-size: 24px;
      font-weight: bold;
      color: #4a9df8;
      margin: 20px 0;
    }
    .hidden {
      position: absolute;
      left: -9999px;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Security Verification</h2>
    <p>Please complete this verification to continue</p>
    
    <form method="post">
      {% csrf_token %}
      
      <input type="hidden" name="next" value="{{ request.GET.next|default:'/' }}">
      
      <!-- Honeypot field for bot detection -->
      <div class="hidden">
        <input type="text" name="hp_field" value="" tabindex="-1">
      </div>
      
      <!-- Math Challenge -->
      <div>
        <label>Solve this math problem:</label>
        <div class="math-question">
          {{ math_question }}
        </div>
        <input type="number" 
               name="math_answer" 
               placeholder="Enter your answer"
               required
               autocomplete="off">
      </div>
      
      <div>
        <input type="submit" value="Submit Answer">
      </div>
      
      <div class="footer">
        <p>This verification helps protect against automated attacks</p>
        <p>No personal information is collected</p>
      </div>
    </form>
  </div>
</body>
</html>
