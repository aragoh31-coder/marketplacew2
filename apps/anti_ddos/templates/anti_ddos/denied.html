{% load static %}
<!DOCTYPE html>
<html lang="en">

    body { 
      background: linear-gradient(135deg, #1a0a0a 0%, #2e1a1a 100%);
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

</html>
