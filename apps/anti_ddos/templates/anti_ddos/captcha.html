{% extends 'base.html' %}
{% load svg_extras %}
{% block title %}Security Verification{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto;padding:1rem 1.25rem;">
  <h1>Security Verification</h1>
  <p style="opacity:.9;margin:.75rem 0 1rem">Solve this math problem:</p>
  <div id="challenge-text" style="margin-bottom:.5rem">
    {% render_math_svg challenge_text 20 %}
  </div>
  <!-- trace: {{ challenge_id }} -->

  <form method="post" action="{% url 'anti_ddos:captcha' %}" autocomplete="off">
    {% csrf_token %}
    <input type="text" name="answer" id="answer" required class="input" inputmode="numeric">
    <input type="hidden" name="challenge_id" value="{{ challenge_id }}">
    <button type="submit" class="btn primary">Submit Answer</button>
  </form>

  {% if error %}
    <p class="text-error">{{ error }}</p>
  {% endif %}
</div>
{% endblock %}
