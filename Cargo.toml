[package]
name = "axum-marketplace"
version = "2.0.0"
edition = "2021"

[dependencies]
# Core
axum = { version = "0.6", features = ["macros", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.4", features = ["fs", "trace", "cors", "limit", "normalize-path"] }

# Database
# sqlx = { version = "0.5", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
redis = { version = "0.22", features = ["tokio-comp", "connection-manager"] }

# Security
base64 = "0.13"
base32 = "0.4"
rand = "0.8"
sha2 = "0.10"

# Web
askama = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto

# Utils
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
